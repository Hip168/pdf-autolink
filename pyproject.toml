[project]
name = "pdf-autolink"
version = "0.1.0"
description = "Auto-hyperlink sheet numbers, detail callouts and sheet indexes in drawing-set PDFs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pikepdf",
    "pdfplumber",
]

[project.scripts]
pdf-autolink = "pdf_autolink.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "reportlab",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_autolink"]

[tool.ruff]
line-length = 100
